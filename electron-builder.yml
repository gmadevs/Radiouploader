appId: io.github.gmadevs.radiouploader
productName: Radiouploader
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  # Runtime dependencies are packed automatically. Trim what they carry for
  # development only — sources, sourcemaps, docs and test fixtures — which is
  # most of their weight and none of their function.
  - '!node_modules/**/*.{map,md,markdown}'
  - '!node_modules/**/{src,spec,test,tests,__tests__,docs,doc,fixtures,example,examples,scripts}/**'
  - '!node_modules/**/{Dockerfile,jest.config.js,.eslintrc.js,tsconfig.json,CLAUDE.md,.editorconfig}'
  # Each codec publishes three builds: an asm.js one, a WASM one carrying the
  # encoder, and the decode-only WASM one. Only the decode-only one is loaded —
  # see the entry points in src/main/codecs/decode.ts — and the other two are
  # 4.5 MB of code that never runs. libjpeg-turbo is the exception: its encoder
  # compresses the frames of a video (src/main/codecs/encode.ts), so its full
  # WASM build ships and only its asm.js one is left out. openjph publishes
  # only the one build, so it is not named here.
  - '!node_modules/@cornerstonejs/codec-libjpeg-turbo-8bit/dist/libjpegturbojs*.js'
  - '!node_modules/@cornerstonejs/codec-charls/dist/charlsjs*.js'
  - '!node_modules/@cornerstonejs/codec-charls/dist/charlswasm.{js,wasm}'
  - '!node_modules/@cornerstonejs/codec-openjpeg/dist/openjpegjs*.js'
  - '!node_modules/@cornerstonejs/codec-openjpeg/dist/openjpegwasm.{js,wasm}'
asarUnpack:
  - resources/**
  # Each codec finds its own .wasm beside its .js and reads it with plain fs.
  # Unpacked, that is an ordinary path rather than one the asar shim has to
  # answer for.
  - node_modules/@cornerstonejs/**
mac:
  # The ffmpeg that decodes DICOM video, for the architecture of this dmg rather
  # than of the machine building it — one runner builds both. Fetched and
  # pinned by scripts/ffmpeg.mjs, which the dist scripts run first.
  extraResources:
    - from: node_modules/.cache/ffmpeg/darwin-${arch}
      to: ffmpeg
  # Named outright. With resources/icons present electron-builder built the icns
  # from that Linux set, which stops at 512, and 1.3.4's first draft had a Mac
  # icon with no Retina layer; the install job now checks for it.
  icon: resources/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.medical
  # Renderer needs no camera/mic; hardened runtime is required for notarisation.
  hardenedRuntime: true
  gatekeeperAssess: false
linux:
  extraResources:
    - from: node_modules/.cache/ffmpeg/linux-${arch}
      to: ffmpeg
  # The sizes the hicolor theme declares, cut by npm run icon. Left to itself,
  # electron-builder installed the 1024 icon alone, in a directory the theme
  # does not list, and the menu entry had no icon (#8).
  icon: resources/icons
  # fpm refuses to build a deb without a maintainer, and takes it from the
  # author's email otherwise. This is the address the app already shows in its
  # problem-report dialog; a deb published to strangers is no place for another.
  maintainer: Giorgio Maria Agazzi <gmadeveloping+radiouploader@gmail.com>
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  category: Science
deb:
  # electron-builder's default list, and the two libraries it leaves out that
  # the binary links against: ALSA and Mesa's gbm. A desktop always has both; a
  # minimal Debian or Ubuntu does not, and there apt installed the package and
  # left a binary that could not load.
  #
  # ALSA is asked for by its new name first. On Ubuntu 24.04 plain libasound2
  # is only a name two packages answer to, and apt chose liboss4-salsa-asound2 —
  # an OSS emulation that lacks half of ALSA — so the binary loaded and died on
  # its first missing symbol. Older releases have no libasound2t64 and take the
  # second name, which is still a real package there.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
    - libgbm1
win:
  extraResources:
    - from: node_modules/.cache/ffmpeg/win32-${arch}
      to: ffmpeg
  # Named outright for the same reason as the Mac's: the Linux set is not its source.
  icon: resources/icon.png
  target:
    - target: nsis
      arch: [x64]
