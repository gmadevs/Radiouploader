name: Build

# Runs on demand, and on a version tag so a release gets installers attached.
# Not on every push: macOS and Windows runners bill at 10x and 2x on a private
# repository, and a full three-platform run is not worth spending on a typo fix.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Building an installer reads the repository and writes nothing to it. The one
# job that does write — drafting the release the installers attach to — asks
# for that itself, below, so a compromised dependency pulled in by `npm ci`
# on three runners cannot push a commit or move a tag.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide whether the others build.
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            script: dist:mac
            artifacts: release/*.dmg
          - name: Linux
            os: ubuntu-latest
            script: dist:linux
            artifacts: |
              release/*.AppImage
              release/*.deb
          - name: Windows
            os: windows-latest
            script: dist:win
            artifacts: release/*.exe

    # Every action here is on its current major. They were all moved at once
    # when GitHub deprecated Node 20 and started forcing these onto Node 24;
    # what the majors in between changed does not reach this workflow — the
    # download is of every artifact rather than one by id, which is the case
    # download-artifact v5 changed, and nothing here uploads a file unzipped.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Electron ships a ~100 MB binary per platform; caching it saves most of
      # the install time on repeat runs.
      - name: Cache Electron download
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~\AppData\Local\electron\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Typecheck and test
        run: npm test

      - name: Build installers
        run: npm run ${{ matrix.script }}
        env:
          # There is no Developer ID on CI. Without this electron-builder hunts
          # for a signing identity and fails instead of producing an unsigned dmg.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # GH_TOKEN is deliberately not set: electron-builder would then try to
          # publish a release itself rather than leaving the files as artifacts.
          # Withholding it is not enough on its own — on CI with a tag present
          # electron-builder still tries, and fails asking for the token — so
          # `--publish never` is on each dist script.

      - uses: actions/upload-artifact@v7
        with:
          name: radiouploader-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  # Each installer installed the way somebody downloading it would, on a machine
  # that did not build it; the app that install left behind is opened and
  # checked from outside, then removed. `npm run smoke` proves out/ boots, and
  # this proves the packages do. It stands between the build and the draft, so a
  # release whose installer does not install is never drafted.
  install:
    name: Install ${{ matrix.name }}
    needs: build
    runs-on: ${{ matrix.os }}
    # A deb is also installed into a bare image. A runner has hundreds of
    # libraries preinstalled, and any of them can satisfy a dependency the
    # package forgot to declare; an image with nothing in it cannot. Empty for
    # the rest, which then run on the runner itself.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dmg, Apple silicon
            os: macos-latest
            format: dmg
            artifact: radiouploader-macOS
          - name: dmg, Intel
            os: macos-15-intel
            format: dmg
            artifact: radiouploader-macOS
          - name: Windows installer
            os: windows-latest
            format: nsis
            artifact: radiouploader-Windows
          - name: AppImage x64
            os: ubuntu-24.04
            format: appimage
            artifact: radiouploader-Linux
          - name: AppImage arm64
            os: ubuntu-24.04-arm
            format: appimage
            artifact: radiouploader-Linux
          # On the runner itself, as a user and not as root: the one Linux run
          # where the sandbox and the AppArmor profile the deb installs are real.
          - name: deb, Ubuntu 24.04
            os: ubuntu-24.04
            format: deb
            artifact: radiouploader-Linux
          - name: deb, clean Debian 12
            os: ubuntu-24.04
            container: debian:12
            format: deb
            artifact: radiouploader-Linux
          - name: deb, clean Ubuntu 22.04
            os: ubuntu-24.04
            container: ubuntu:22.04
            format: deb
            artifact: radiouploader-Linux
          - name: deb arm64, clean Ubuntu 24.04
            os: ubuntu-24.04-arm
            container: ubuntu:24.04
            format: deb
            artifact: radiouploader-Linux

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      # The runners carry a Node of their own, the bare images none, and the
      # script wants 22 for its WebSocket.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: pkg

      - name: Install
        run: node scripts/installed.mjs ${{ matrix.format }} install pkg

      # After the install, never before it: xvfb brings half of X with it, which
      # would quietly supply a library the deb forgot to ask for. FUSE is what an
      # AppImage mounts itself with, and Ubuntu 24.04 does not ship it.
      - name: Give Linux a display
        if: runner.os == 'Linux'
        run: |
          sudo=$(command -v sudo || true)
          packages=(xvfb xauth)
          if [ "${{ matrix.format }}" = appimage ]; then packages+=(libfuse2t64); fi
          $sudo apt-get update -q
          $sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -q "${packages[@]}"

      - name: Launch
        run: >
          ${{ runner.os == 'Linux' && 'xvfb-run -a -s "-screen 0 1600x1000x24"' || '' }}
          node scripts/installed.mjs ${{ matrix.format }} launch pkg

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: installed-${{ matrix.name }}
          path: installed.png
          if-no-files-found: ignore
          retention-days: 14

      # A dmg is uninstalled by dragging the app to the Bin and an AppImage by
      # deleting it, which leaves nothing for a test to look for.
      - name: Uninstall
        if: matrix.format == 'nsis' || matrix.format == 'deb'
        run: node scripts/installed.mjs ${{ matrix.format }} uninstall pkg

  release:
    name: Draft release
    needs: [build, install]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Drafted rather than published, so the installers can be checked before
      # anyone can download them. Not flagged as a pre-release since 1.0.0: the
      # warnings that matter are about what the app does not check, and they are
      # in the body below rather than in a label on the release.
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: false
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            **Nothing here is signed**, so the first launch needs one extra step per
            platform — on macOS `xattr -dr com.apple.quarantine` on the app, or allow it
            in System Settings → Privacy & Security; More info → Run anyway on Windows;
            `chmod +x` on the AppImage. See
            [Install and sign in](https://gmadevs.github.io/Radiouploader/guide/install).

            **The app never tells you your images are clean.** It does look through the
            images for burnt-in text before anonymising, and rings what it finds — but it
            finds obvious banners and misses small print, text written over anatomy, and
            anything on the images it did not read. A series it says nothing about is a
            series nothing was noticed in, which is not the same thing. Look at every frame
            yourself before uploading, and read
            [Known limitations](https://gmadevs.github.io/Radiouploader/limitations) first.

            Uploads land as **draft** cases on Radiopaedia, so nothing goes public
            without you publishing it. Please report anything that breaks in
            [Issues](https://github.com/gmadevs/Radiouploader/issues).

            ---
